; skygfx_headlights.ini — Faros de coches, ilusión PS2 (nivel 1)
; Va junto a skygfx.asi, en la misma carpeta.
; Si el archivo no existe, el efecto queda apagado.
; Si un valor está fuera de rango, el código lo recorta al límite duro.
; Recarga en caliente: menú debug SkyGFX > Reload Inis.

[Headlights]
; Interruptor maestro. 0 = apagado, 1 = encendido.
enabled=1

; Cada valor se ajusta por separado, a gusto del usuario.

; 1. POTENCIA de las luces. 0.0 - 2.0 (límite duro 2.0)
; Multiplica cono + charco + corona.
intensity=1.0

; 2. DISTANCIA / alcance en metros. 5 - 40 (límite duro 40)
; También es el corte de rendimiento: más allá no se dibuja nada.
range=28.0

; 3. VOLUMEN del cono (ancho). 0.5 - 2.0 (límite duro 2.0)
coneWidth=1.0

; 3. VOLUMEN del cono (densidad / opacidad). 0.0 - 1.0 (límite duro 1.0)
coneOpacity=0.35

; Charco de luz en el suelo (intensidad). 0.0 - 1.5 (límite duro 1.5)
poolIntensity=0.8

; Charco de luz en el suelo (largo, relativo al alcance). 0.5 - 1.5
poolLength=1.0

; Corona del faro (tamaño/brillo). 0.5 - 2.0 (límite duro 2.0)
; 1.0 = como el juego original.
coronaBoost=1.25

; 4. CANTIDAD de autos con efecto a la vez. 1 - 8 (límite duro 8)
; Tu coche siempre tiene prioridad. El resto son los más cercanos.
maxCars=4

; Color de la luz (cálido PS2). 0 - 255 por canal.
lightColorR=255
lightColorG=240
lightColorB=200

; Solo de noche / con las luces encendidas. 0 = también de día.
onlyAtNight=1

; Atenuar con la lluvia. 0 = no atenúa, 1 = atenúa.
rainFade=1

; A partir de qué parte del alcance empieza a desvanecerse el cono.
; 0.6 = se desvanece en el último 40% del alcance. 0.0 - 0.9
fadeStart=0.6

; --- Valores de referencia (solo como guía, copia los que quieras) ---
; Bajo:  intensity=0.7, range=20, coneWidth=0.8, coneOpacity=0.25, poolIntensity=0.5, poolLength=0.8, coronaBoost=1.0, maxCars=2
; Medio: intensity=1.0, range=28, coneWidth=1.0, coneOpacity=0.35, poolIntensity=0.8, poolLength=1.0, coronaBoost=1.25, maxCars=4
; Alto:  intensity=1.3, range=34, coneWidth=1.2, coneOpacity=0.45, poolIntensity=1.0, poolLength=1.1, coronaBoost=1.5, maxCars=6
; Ultra: intensity=1.6, range=40, coneWidth=1.4, coneOpacity=0.55, poolIntensity=1.2, poolLength=1.2, coronaBoost=1.75, maxCars=8
